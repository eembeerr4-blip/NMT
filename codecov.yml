# Codecov configuration for NMT Academy.
# Thresholds are intentionally modest until baseline coverage is measured in CI.
codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: false
    patch:
      default:
        target: 60%
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

ignore:
  - "e2e/**"
  - "scripts/**"
  - "prisma/migrations/**"
  - "**/*.config.*"
  - "content/**"
  - "docs/**"
  - "audit/**"
  - "design/**"
