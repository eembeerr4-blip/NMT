<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
<title id="title">Мітоз і мейоз: плоїдність та кількість ДНК</title><desc id="desc">У спрощеній диплоїдній моделі перед реплікацією 2n2c, після реплікації 2n4c. Мітоз із цитокінезом дає дві клітини 2n2c. Мейоз I дає дві n2c, мейоз II — чотири n1c. Генетична мінливість не зображена.</desc>
<rect width="800" height="420" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle"><text x="400" y="32" font-size="23">Диплоїдна модель: 2n / кількість ДНК c</text><text x="400" y="70" font-size="20">2n2c → реплікація → 2n4c</text><path d="M400 90L200 130 M400 90L600 130" stroke="#334155" stroke-width="3"/><text x="200" y="155" font-size="22">Мітоз + цитокінез</text><text x="600" y="155" font-size="22">Мейоз I</text><g fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"><rect x="65" y="185" width="120" height="65" rx="14"/><rect x="215" y="185" width="120" height="65" rx="14"/><rect x="465" y="185" width="120" height="65" rx="14"/><rect x="615" y="185" width="120" height="65" rx="14"/></g><g font-size="22"><text x="125" y="224">2n2c</text><text x="275" y="224">2n2c</text><text x="525" y="224">n2c</text><text x="675" y="224">n2c</text></g><text x="600" y="284" font-size="22">Мейоз II → 4 клітини n1c</text><text x="400" y="340" font-size="18">n — набори хромосом; c — відносна кількість ДНК</text><text x="400" y="372" font-size="17">Схема не показує особливості овогенезу й усіх життєвих циклів.</text><text x="400" y="400" font-size="15">Авторська схема NMT Academy. Не зображення з Telegram або підручника.</text></g></svg>
